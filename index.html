<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffb6cf" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💗%3C/text%3E%3C/svg%3E" />
<title>❤ 我们的恋爱时光</title>
<style>
  :root {
    --pink: #ff6b9d;
    --pink-deep: #e84a8a;
    --pink-soft: #ffd6e5;
    --text: #7a3b55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #ffdce8, #fff8fa 65%);
    color: var(--text);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- 背景星星 ---- */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute;
    top: -12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px 2px rgba(255, 107, 157, 0.55);
    animation: starFall linear infinite, starTwinkle ease-in-out infinite alternate;
  }
  @keyframes starFall {
    from { transform: translate3d(0, -12px, 0); }
    to   { transform: translate3d(-36px, 108vh, 0); }
  }
  @keyframes starTwinkle {
    from { opacity: 0.45; }
    to   { opacity: 1; }
  }

  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 24px 16px 44px; }

  /* ---- 顶部：标题 + 倒计时 ---- */
  .hero { text-align: center; padding: 28px 12px 18px; }
  .hero h1 {
    font-size: clamp(1.6rem, 6vw, 2.3rem);
    color: var(--pink-deep);
    letter-spacing: 2px;
  }
  .heart-beat { display: inline-block; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.18); }
    45%      { transform: scale(1); }
  }
  .since-line { margin-top: 8px; font-size: 0.95rem; opacity: 0.85; }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 22px auto 0;
    max-width: 560px;
  }
  .countdown .unit {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    border-radius: 18px;
    padding: 14px 4px 12px;
    box-shadow: 0 8px 24px rgba(255, 107, 157, 0.18);
  }
  .countdown .num {
    font-size: clamp(1.5rem, 8vw, 2.6rem);
    font-weight: 700;
    color: var(--pink);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .countdown .lab {
    display: block;
    margin-top: 6px;
    font-size: 0.8rem;
    letter-spacing: 2px;
    opacity: 0.7;
  }
  .count-note { margin-top: 16px; font-size: 0.9rem; opacity: 0.8; }

  /* ---- 通用小标题 ---- */
  .section { margin-top: 44px; }
  .section h2 {
    text-align: center;
    font-size: clamp(1.25rem, 5vw, 1.6rem);
    color: var(--pink-deep);
    letter-spacing: 3px;
  }
  .section h2::after {
    content: "";
    display: block;
    width: 46px;
    height: 3px;
    margin: 10px auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--pink-soft), var(--pink));
  }

  /* ---- 照片墙 ---- */
  .photo-wall {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin: 20px auto 0;
    max-width: 780px;
  }
  .photo { width: calc((100% - 28px) / 3); }
  .photo {
    position: relative;
    background: #fff;
    padding: 8px 8px 30px;
    border-radius: 4px;
    cursor: zoom-in;
    box-shadow: 0 6px 18px rgba(201, 90, 130, 0.22);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .photo:nth-child(3n+1) { transform: rotate(-2deg); }
  .photo:nth-child(3n+2) { transform: rotate(1.5deg); }
  .photo:nth-child(3n)   { transform: rotate(-0.5deg); }
  .photo-inner {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 2px;
    background: var(--pink-soft);
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.55s ease;
  }
  .photo-date {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8px;
    text-align: center;
    font-size: 0.75rem;
    color: #b46a88;
    font-family: 'Segoe Script', 'Comic Sans MS', cursive;
    letter-spacing: 1px;
  }
  .photo:hover {
    transform: rotate(0) translateY(-5px) scale(1.03);
    box-shadow: 0 16px 34px rgba(201, 90, 130, 0.32);
  }
  .photo:hover img { transform: scale(1.1); }

  /* ---- 每日一句话 ---- */
  .daily-card {
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--pink-soft);
    border-radius: 18px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    box-shadow: 0 8px 22px rgba(255, 107, 157, 0.12);
  }
  .daily-card p {
    font-size: clamp(1rem, 4vw, 1.15rem);
    color: var(--pink-deep);
    letter-spacing: 1px;
  }
  .daily-date { display: block; margin-top: 10px; font-size: 0.8rem; opacity: 0.65; }

  /* ---- 语音留言 ---- */
  .voice-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--pink-soft);
    border-radius: 22px;
    padding: 26px 20px;
    margin-top: 20px;
    box-shadow: 0 8px 22px rgba(255, 107, 157, 0.12);
  }
  .voice-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    color: #fff;
    background: linear-gradient(135deg, #ff8fb3, #ff6b9d);
    box-shadow: 0 8px 20px rgba(255, 107, 157, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .voice-btn:active { transform: scale(0.92); }
  .voice-btn.playing { animation: voicePulse 1.6s ease-in-out infinite; }
  @keyframes voicePulse {
    0%, 100% { box-shadow: 0 8px 20px rgba(255, 107, 157, 0.35), 0 0 0 0 rgba(255, 107, 157, 0.45); }
    50%      { box-shadow: 0 8px 20px rgba(255, 107, 157, 0.35), 0 0 0 18px rgba(255, 107, 157, 0); }
  }
  .voice-tip { font-size: 0.9rem; opacity: 0.75; }

  /* ---- 歌词彩蛋 ---- */
  #lyric {
    position: fixed;
    bottom: 46px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    max-width: 86vw;
    text-align: center;
    font-size: 0.92rem;
    letter-spacing: 2px;
    color: var(--pink-deep);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  #lyric.show { opacity: 1; }

  /* ---- 情话 ---- */
  .love-letter {
    position: relative;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--pink-soft);
    border-radius: 22px;
    padding: 28px 24px;
    margin-top: 24px;
    box-shadow: 0 10px 30px rgba(255, 107, 157, 0.14);
  }
  .love-letter::before {
    content: "❝";
    position: absolute;
    top: 6px;
    left: 16px;
    font-size: 3rem;
    color: var(--pink-soft);
    line-height: 1;
  }
  .love-letter p {
    font-size: clamp(0.98rem, 3.5vw, 1.08rem);
    line-height: 2;
    text-indent: 2em;
    color: #8a4a63;
  }
  .love-letter .sign { text-align: right; margin-top: 14px; text-indent: 0; opacity: 0.85; }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 0.85rem;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* ---- 点击看大图 ---- */
  /* ---- 背景音乐按钮 ---- */
  .music-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 5;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 6px 18px rgba(255, 107, 157, 0.3);
    font-size: 1.35rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .music-btn.playing { animation: spin 4s linear infinite; }
  .music-btn.no-music { opacity: 0.55; }
  @keyframes spin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }

  /* ---- 首屏淡入 ---- */
  .fade-in { opacity: 0; animation: fadeUp 0.7s ease forwards; }
  .fade-photo { opacity: 0; animation: fadeIn 0.6s ease forwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(40, 10, 25, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #lightbox.show { opacity: 1; pointer-events: auto; }
  #lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(255, 107, 157, 0.4);
  }
  .lightbox-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .lightbox-arrow:active { background: rgba(255, 255, 255, 0.3); }
  #lbPrev { left: 12px; }
  #lbNext { right: 12px; }
  #lbCount {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.85rem;
    letter-spacing: 2px;
  }
  #lbCaption {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 86vw;
    text-align: center;
    color: rgba(255, 255, 255, 0.92);
    font-size: 0.92rem;
    letter-spacing: 1px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
  }
  body.no-scroll { overflow: hidden; }

  @media (max-width: 600px) {
    .photo-wall { gap: 10px; }
    .photo { width: calc((100% - 10px) / 2); }
    .photo:first-child { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .fade-in, .fade-photo { opacity: 1 !important; }
  }
</style>
</head>
<body>
  <div id="stars"></div>

  <button class="music-btn" id="musicBtn" title="播放背景音乐">💿</button>
  <audio id="bgm" loop preload="auto"></audio>
  <div id="lyric"></div>

  <div class="wrap">
    <header class="hero">
      <h1 class="fade-in" style="animation-delay:.1s"><span class="heart-beat">💗</span> 我们的恋爱时光</h1>
      <p class="since-line fade-in" style="animation-delay:.25s" id="sinceLine"></p>
      <div class="countdown fade-in" style="animation-delay:.4s">
        <div class="unit"><div class="num" id="d">0</div><span class="lab">天</span></div>
        <div class="unit"><div class="num" id="h">0</div><span class="lab">时</span></div>
        <div class="unit"><div class="num" id="m">0</div><span class="lab">分</span></div>
        <div class="unit"><div class="num" id="s">0</div><span class="lab">秒</span></div>
      </div>
      <p class="count-note fade-in" style="animation-delay:.55s">在一起的每一秒，都值得纪念 ❤</p>
    </header>

    <section class="section">
      <h2 class="fade-in" style="animation-delay:.6s">📷 我们的合照</h2>
      <div class="photo-wall" id="photoWall"></div>
    </section>

    <section class="section fade-in" style="animation-delay:.95s">
      <h2>💌 写给你的情话</h2>
      <div class="love-letter">
        <p>烨子今年考研一志愿上岸。可对我来说，爱是每天醒来第一个想到你，是看到好吃的第一反应是带给你。世界很大，人很多，但我的目光，只落在你一个人身上。谢谢你来到我的生命里，让每一个平凡的日子都闪闪发光。往后的路还很长，我想牵着你的手，慢慢走完。遇到了你，我的生活变成了彩色。</p>
        <p class="sign">—— 江宽</p>
      </div>
    </section>

    <section class="section fade-in" style="animation-delay:1.1s">
      <h2>💬 今天想对你说</h2>
      <div class="daily-card">
        <p id="dailyWord"></p>
        <span class="daily-date" id="dailyDate"></span>
      </div>
    </section>

    <section class="section fade-in" style="animation-delay:1.2s">
      <h2>🎙️ 说给你听</h2>
      <div class="voice-card">
        <button class="voice-btn" id="voiceBtn" title="播放语音">▶</button>
        <p class="voice-tip" id="voiceTip">点一下，听听我想对你说的话</p>
      </div>
      <audio id="voice" preload="none"></audio>
    </section>

    <footer class="fade-in" style="animation-delay:1.3s">❤ 遇见你，是我最大的幸运 ❤</footer>
  </div>

  <div id="lightbox">
    <button class="lightbox-arrow" id="lbPrev" title="上一张">❮</button>
    <img id="lightboxImg" alt="合照" />
    <button class="lightbox-arrow" id="lbNext" title="下一张">❯</button>
    <span id="lbCount"></span>
    <div id="lbCaption"></div>
  </div>

  <script>
    /* ==================== 在这里修改配置 ==================== */
    // ← 把日期改成你们在一起的那天（格式：年-月-日）
    const TOGETHER_DATE = new Date('2026-09-24T00:00:00');

    // ← 把合照放到本文件旁边的 photos 文件夹里，或把下面改成图片链接
    //    想加更多照片？继续加 'photos/6.jpg'、'photos/7.jpg' 就行
    const PHOTOS = [
      'photos/1.jpg?v=2',
      'photos/2.jpg?v=2',
      'photos/3.jpg?v=2',
      'photos/4.jpg?v=2',
      'photos/5.jpg?v=2',
    ];

    // ← 背景音乐：把《我们俩》mp3 文件放到本文件夹，命名为 music.mp3（本地优先）
    //    也可以把 BGM_URL 改成在线 mp3 链接，本地文件不存在时会用它
    const BGM_URL = '';

    // ← 每张照片的配文（和 PHOTOS 顺序对应，点开大图时显示在下方）
    const CAPTIONS = [
      '摸摸烨子头，万事不用愁。',
      '可爱的烨子和不知情的丈夫',
      '手机拍的最正经的一张合照了',
      '希望下次手上拿的是戒指',
      '最喜欢这种生活中的小合照',
    ];
    // ← 每张照片的日期（显示在拍立得相片下方）
    const DATES = [
      '2026.09.26',
      '2026.09.26',
      '2026.09.29',
      '2026.09.29',
      '2026.09.28',
    ];
    // ← 每日一句话：按 星期日~星期六 排 7 句，她每天打开看到的都不一样
    const DAILY_WORDS = [
      '你是我平淡日子里最甜的惊喜',
      '新的一周，最想见的人还是你',
      '今天也要记得想我哦',
      '想带你去看每一场日落',
      '一周过半，想你的心一点没减',
      '周五啦，离见面又近了一天',
      '周末快乐，我的小朋友',
    ];
    // ← 语音留言：把录音导出为 mp3，命名为 voice.mp3 放到本文件夹
    const VOICE_FILE = 'voice.mp3';
    // ← 歌词彩蛋：音乐播放时轮流浮现的歌词（《我们俩》）
    const LYRIC_LINES = [
      '你在左边，我紧靠右',
      '第一张照片，不太敢亲密的',
      '苹果一样带甜的羞涩',
    ];
    /* ======================================================== */

    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, '0');

    /* ---- 恋爱倒计时 ---- */
    const sinceLine = $('sinceLine');
    sinceLine.textContent = '始于 ' + TOGETHER_DATE.getFullYear() + ' 年 ' +
      (TOGETHER_DATE.getMonth() + 1) + ' 月 ' + TOGETHER_DATE.getDate() + ' 日 · 爱你如初';

    function tick() {
      let diff = new Date() - TOGETHER_DATE;
      if (diff < 0) diff = 0;
      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor(diff % 86400000 / 3600000);
      const mins  = Math.floor(diff % 3600000 / 60000);
      const secs  = Math.floor(diff % 60000 / 1000);
      $('d').textContent = days;
      $('h').textContent = pad(hours);
      $('m').textContent = pad(mins);
      $('s').textContent = pad(secs);
    }
    tick();
    setInterval(tick, 1000);

    /* ---- 照片墙（没放照片时显示粉色爱心占位图） ---- */
    const wall = $('photoWall');
    const fallback = i => 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd9e8"/>
            <stop offset="1" stop-color="#ffb6cf"/>
          </linearGradient>
        </defs>
        <rect width="400" height="400" fill="url(#g)"/>
        <g transform="translate(80,40) scale(10)">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff6b9d" opacity="0.9"/>
        </g>
        <text x="200" y="330" font-size="22" fill="#d6407f" text-anchor="middle" font-family="sans-serif">照片 ${i}</text>
      </svg>`);

    PHOTOS.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'photo fade-photo';
      div.style.animationDelay = (0.7 + i * 0.12) + 's';
      const img = document.createElement('img');
      img.src = src;
      img.alt = '合照 ' + (i + 1);
      img.loading = 'lazy';
      img.addEventListener('error', () => { img.src = fallback(i + 1); });
      const inner = document.createElement('div');
      inner.className = 'photo-inner';
      inner.appendChild(img);
      div.appendChild(inner);
      const date = document.createElement('span');
      date.className = 'photo-date';
      date.textContent = DATES[i] || '';
      div.appendChild(date);
      wall.appendChild(div);
    });

    /* ---- 照片灯箱：左右箭头 / 手机滑动 / 键盘方向键 ---- */
    const lightbox = $('lightbox');
    const lightboxImg = $('lightboxImg');
    const lbCount = $('lbCount');
    const lbCaption = $('lbCaption');
    let lbIndex = 0;

    function getImgs() { return wall.querySelectorAll('img'); }
    function showPhoto(i) {
      const imgs = getImgs();
      lbIndex = (i + imgs.length) % imgs.length;
      lightboxImg.src = imgs[lbIndex].src;
      lbCount.textContent = (lbIndex + 1) + ' / ' + imgs.length;
      const cap = CAPTIONS[lbIndex] || '';
      lbCaption.textContent = cap;
      lbCaption.style.display = cap ? '' : 'none';
    }
    function openLightbox(i) {
      showPhoto(i);
      lightbox.classList.add('show');
      document.body.classList.add('no-scroll');
    }
    function closeLightbox() {
      lightbox.classList.remove('show');
      document.body.classList.remove('no-scroll');
    }
    wall.addEventListener('click', e => {
      const img = e.target.closest('img');
      if (!img) return;
      openLightbox(Array.prototype.indexOf.call(getImgs(), img));
    });
    $('lbPrev').addEventListener('click', e => { e.stopPropagation(); showPhoto(lbIndex - 1); });
    $('lbNext').addEventListener('click', e => { e.stopPropagation(); showPhoto(lbIndex + 1); });
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('show')) return;
      if (e.key === 'ArrowLeft') showPhoto(lbIndex - 1);
      else if (e.key === 'ArrowRight') showPhoto(lbIndex + 1);
      else if (e.key === 'Escape') closeLightbox();
    });
    // 手机上左右滑动切换
    let touchX = 0;
    lightbox.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) showPhoto(lbIndex + (dx < 0 ? 1 : -1));
    }, { passive: true });

    /* ---- 背景音乐 ---- */
    const bgm = $('bgm');
    const musicBtn = $('musicBtn');
    bgm.src = 'music.mp3';
    bgm.addEventListener('error', () => {
      if (BGM_URL && bgm.src !== BGM_URL) {
        bgm.src = BGM_URL; // 本地文件不存在，试试在线链接
      } else {
        musicBtn.title = '没有找到 music.mp3，请把歌曲放到本文件夹';
        musicBtn.classList.add('no-music');
      }
    });

    function startMusic() {
      bgm.volume = 0.6;
      if (typeof voice !== 'undefined' && !voice.paused) {
        voice.pause();
        voiceBtn.textContent = '▶';
        voiceBtn.classList.remove('playing');
      }
      bgm.play().then(() => musicBtn.classList.add('playing')).catch(() => {});
    }
    musicBtn.addEventListener('click', () => {
      if (bgm.paused) startMusic();
      else { bgm.pause(); musicBtn.classList.remove('playing'); }
    });
    // 手机浏览器会拦截自动播放：第一次点击页面任意位置时自动开始
    document.addEventListener('pointerdown', function once(e) {
      if (e.target === musicBtn) return; // 点的是按钮就交给按钮处理
      document.removeEventListener('pointerdown', once);
      if (bgm.paused) startMusic();
    });

    /* ---- 歌词彩蛋：音乐播放时轮流浮现 ---- */
    const lyricEl = $('lyric');
    let lyricIdx = 0;
    let lyricHideTimer = null;
    let lyricCycle = null;
    function showLyric() {
      lyricEl.textContent = LYRIC_LINES[lyricIdx % LYRIC_LINES.length];
      lyricIdx++;
      lyricEl.classList.add('show');
      clearTimeout(lyricHideTimer);
      lyricHideTimer = setTimeout(() => lyricEl.classList.remove('show'), 6000);
    }
    bgm.addEventListener('play', () => { showLyric(); lyricCycle = setInterval(showLyric, 9000); });
    bgm.addEventListener('pause', () => {
      clearInterval(lyricCycle);
      clearTimeout(lyricHideTimer);
      lyricEl.classList.remove('show');
    });

    /* ---- 语音留言 ---- */
    const voice = $('voice');
    const voiceBtn = $('voiceBtn');
    const voiceTip = $('voiceTip');
    voice.src = VOICE_FILE;
    voiceBtn.addEventListener('click', () => {
      if (voice.paused) {
        voice.play().then(() => {
          voiceBtn.textContent = '⏸';
          voiceBtn.classList.add('playing');
          bgm.pause();
          musicBtn.classList.remove('playing');
        }).catch(() => {});
      } else {
        voice.pause();
        voiceBtn.textContent = '▶';
        voiceBtn.classList.remove('playing');
      }
    });
    voice.addEventListener('ended', () => {
      voiceBtn.textContent = '▶';
      voiceBtn.classList.remove('playing');
    });
    voice.addEventListener('error', () => {
      voiceBtn.textContent = '🔇';
      voiceBtn.classList.remove('playing');
      voiceTip.textContent = '语音还没放进来，等我一下下';
    });

    /* ---- 每日一句话（按星期轮换） ---- */
    const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const today = new Date();
    $('dailyWord').textContent = DAILY_WORDS[today.getDay()];
    $('dailyDate').textContent = today.getFullYear() + ' 年 ' + (today.getMonth() + 1) + ' 月 ' +
      today.getDate() + ' 日 · ' + WEEKDAYS[today.getDay()];

    /* ---- 星星飘落 ---- */
    const STAR_COUNT = 26; // 星星数量：改大更热闹，改小更安静
    const starBox = $('stars');
    for (let i = 0; i < STAR_COUNT; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      const size = 3 + Math.random() * 3;
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = (16 + Math.random() * 18) + 's, ' + (1.5 + Math.random() * 2) + 's';
      s.style.animationDelay = (-Math.random() * 34) + 's';
      starBox.appendChild(s);
    }
  </script>
</body>
</html>
